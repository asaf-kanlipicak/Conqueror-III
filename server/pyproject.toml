[project]
name = "conqueror-iii-server"
version = "0.2.0"
description = "Conqueror III Server"
requires-python = ">=3.14, <3.15"
dependencies = [
    "fastapi>=0.162.7",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
